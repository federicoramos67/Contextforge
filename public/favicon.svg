<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ContextForge">
  <title>ContextForge</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d5bff" />
      <stop offset="1" stop-color="#7da1ff" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <!-- Corchetes: el contexto que se prepara alrededor del prompt -->
  <path
    d="M24 18 L14 32 L24 46 M40 18 L50 32 L40 46"
    fill="none"
    stroke="#0d111c"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.85"
  />
  <!-- Chispa central: la respuesta que sale de ese contexto -->
  <circle cx="32" cy="32" r="5" fill="#0d111c" opacity="0.85" />
</svg>
