name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
  # Permite lanzar el deploy manualmente desde la pestaña Actions
  workflow_dispatch:

# Permisos mínimos para publicar en Pages con OIDC (id-token)
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez; no cancela uno en curso para no dejar Pages a medias
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SEGURIDAD: build limpio, sin .env ni variables VITE_*_KEY.
      # Vite embebe las VITE_* en el bundle público, así que la demo se
      # buildea sin ninguna key. El sitio corre en modo reglas locales;
      # cada usuario pone su propia key en el navegador (localStorage).
      - name: Build (sin keys de API)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
