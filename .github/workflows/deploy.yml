name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
  # Allows triggering the deploy manually from the Actions tab.
  workflow_dispatch:

# Minimum permissions to publish to Pages with OIDC (id-token).
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a running deploy is never cancelled so Pages is not
# left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SECURITY: clean build, with no .env and no VITE_*_KEY variables.
      # Vite inlines every VITE_* value into the public bundle, so the demo is
      # built without any key. The site runs in local rules mode; each user
      # supplies their own key in their own browser (localStorage).
      - name: Build (no API keys)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
