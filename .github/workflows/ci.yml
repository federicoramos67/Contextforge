name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on the same ref so pushes don't queue up behind
# each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, format, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run coverage

      # SECURITY: no .env and no VITE_*_KEY variables are available here, so
      # the build is verified exactly as it is published.
      - name: Build project
        run: npm run build
